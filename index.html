<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="말은 못 해도, 목탁은 칠 수 있으니까. 직장인을 위한 익명 실시간 이너피스."
    />
    <title>이너피스 — 직장인 합동 수련소</title>
    <link rel="icon" type="image/png" href="./assets/moktak.png" />
    <link rel="apple-touch-icon" href="./assets/moktak.png" />
    <link rel="preload" as="image" href="./assets/moktak.png" />
    <link rel="preload" as="image" href="./assets/mallet.png" />
    <link rel="stylesheet" href="./styles.css?v=20260930-layout" />
    <script defer src="./config.js"></script>
    <script defer src="./app.js?v=20260930-layout"></script>
  </head>
  <body>
    <div class="app" id="app">
      <div class="ambient" aria-hidden="true"></div>
      <div class="message-sky" id="messageSky" aria-hidden="true"></div>

      <header class="topbar">
        <a class="instagram-link" id="instagramLink" href="#" aria-label="인스타그램 계정 열기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4.25" />
            <circle class="instagram-dot" cx="17.5" cy="6.6" r="1" />
          </svg>
        </a>
      </header>

      <main>
        <section class="intro" aria-labelledby="tagline">
          <span class="intro-kicker">INNER PEACE</span>
          <p class="tagline" id="tagline">말은 못 해도,<br /><strong>목탁은 칠 수 있으니까.</strong></p>
          <p class="intro-copy">오늘 회사에서 삼킨 말을 잠깐 내려놓고 가세요.</p>
        </section>

        <section class="stage" id="stage" aria-label="목탁 수련 공간">
          <div class="moktak-scene" id="moktakScene">
            <div class="aura aura-outer" aria-hidden="true"></div>
            <div class="aura aura-inner" aria-hidden="true"></div>
            <div class="ground-shadow" aria-hidden="true"></div>

            <button class="moktak-button" id="moktakButton" type="button" aria-label="목탁 치기">
              <img
                class="moktak-image"
                id="moktakImage"
                src="./assets/moktak.png"
                width="1312"
                height="1199"
                alt=""
                draggable="false"
              />
              <span class="moktak-shine" id="moktakShine" aria-hidden="true"></span>
              <span class="impact-flare" id="impactFlare" aria-hidden="true"></span>
            </button>

            <img
              class="mallet-image"
              id="malletImage"
              src="./assets/mallet.png"
              width="1536"
              height="1024"
              alt=""
              draggable="false"
              aria-hidden="true"
            />

            <div class="effects" id="effects" aria-hidden="true">
              <span class="impact-ring"></span>
              <span class="impact-ring"></span>
              <span class="impact-ring"></span>
            </div>
          </div>

          <p class="tap-hint"><span aria-hidden="true">↟</span> 목탁을 눌러보세요</p>
        </section>
      </main>

      <section class="composer-wrap" aria-label="익명 한마디 남기기">
        <form class="composer" id="messageForm" autocomplete="off">
          <label class="sr-only" for="messageInput">오늘 회사에서 삼킨 말</label>
          <input
            id="messageInput"
            name="message"
            type="text"
            inputmode="text"
            maxlength="36"
            placeholder="오늘 회사에서 삼킨 말…"
            aria-describedby="composerHint"
          />
          <button type="submit">흘려보내기</button>
        </form>
        <div class="composer-meta" id="composerHint">
          <span id="charCount">0 / 36</span>
        </div>
      </section>

      <footer>실명과 회사명은 두고, 번뇌만 올려보내세요.</footer>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
